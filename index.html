<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pruebas Deeplinks</title>

<style>
body{
    font-family:Arial,sans-serif;
    padding:20px;
}

a.btn{
    display:inline-block;
    margin:8px 0;
    padding:12px 18px;
    background:#007AFF;
    color:#FFF;
    text-decoration:none;
    border-radius:6px;
}

a.btn:hover{
    opacity:.9;
}

h3{
    margin-top:30px;
}
</style>

</head>

<body>

<h2>Pruebas Deeplinks</h2>

<p>
El enlace se construye dependiendo del sistema operativo.
</p>

<h3>Mi Claro</h3>

<a id="claro_cenam" class="btn" target="_blank" rel="noopener noreferrer">
Mi Claro CENAM
</a>

<br>

<a id="claro_chile" class="btn" target="_blank" rel="noopener noreferrer">
Mi Claro Chile
</a>

<br>

<a id="claro_ecuador" class="btn" target="_blank" rel="noopener noreferrer">
Mi Claro Ecuador
</a>

<h3>Apps</h3>

<a id="whatsapp" class="btn" target="_blank" rel="noopener noreferrer">
WhatsApp
</a>

<br>

<a id="maps" class="btn" target="_blank" rel="noopener noreferrer">
Google Maps
</a>

<br>

<a id="mercadolibre" class="btn" target="_blank" rel="noopener noreferrer">
Mercado Libre
</a>

<script>

function getOS(){

    const ua = navigator.userAgent;

    if(/android/i.test(ua))
        return "android";

    if(/iPad|iPhone|iPod/.test(ua))
        return "ios";

    return "desktop";
}

const LINKS={

    claro_cenam:{
        android:"intent://com.claro/action?key=RecargasAnonimas#Intent;scheme=link;package=com.claro.miclaro;S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Dcom.claro.miclaro;end;",
        ios:"https://apps.apple.com/gt/app/mi-claro-centroam%C3%A9rica/id953328601"
    },

    claro_chile:{
        android:"intent://com.claro/action?key=RecargasAnonimas#Intent;scheme=link;package=com.miclaro.app;S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Dcom.miclaro.app;end;",
        ios:"https://apps.apple.com/cl/app/mi-claro/id1319458144"
    },

    claro_ecuador:{
        android:"intent://com.claro/action?key=RecargasAnonimas#Intent;scheme=link;package=com.claroecuador.miclaro;S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Dcom.claroecuador.miclaro;end;",
        ios:"https://apps.apple.com/ec/app/mi-claro-ecuador/id603232811"
    },

    whatsapp:{
        android:"intent://send?phone=5215573825171&text=Hola#Intent;scheme=whatsapp;package=com.whatsapp;end;",
        ios:"https://wa.me/5215573825171?text=Hola"
    },

    maps:{
        android:"intent://maps.google.com/maps?q=restaurantes+CDMX#Intent;scheme=https;package=com.google.android.apps.maps;end;",
        ios:"https://maps.google.com/maps?q=restaurantes+CDMX"
    },

    mercadolibre:{
        android:"intent://mercadolibre.com.mx/#Intent;scheme=https;package=com.mercadolibre;end;",
        ios:"https://www.mercadolibre.com.mx"
    }

};

const os=getOS();

Object.keys(LINKS).forEach(id=>{

    const element=document.getElementById(id);

    if(!element)
        return;

    if(os==="android")
        element.href=LINKS[id].android;

    else if(os==="ios")
        element.href=LINKS[id].ios;

    else
        element.href=LINKS[id].ios;

});

</script>

</body>
</html>
